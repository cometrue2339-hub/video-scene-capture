<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영상 장면 캡쳐 서비스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-icon">&#127916;</div>
    <div>
      <h1>영상 장면 캡쳐</h1>
      <p>영상의 주요 장면을 자동으로 감지해 JPG로 추출합니다</p>
    </div>
  </div>
</header>

<main>

  <!-- ── Upload Card ───────────────────────────────────────────────── -->
  <section class="card" id="uploadCard">

    <div class="tabs">
      <button class="tab active" data-tab="file">&#128196; 파일 업로드</button>
      <button class="tab" data-tab="url">&#128279; 링크 입력</button>
    </div>

    <!-- File tab -->
    <div class="tab-pane active" id="pane-file">
      <div class="dropzone" id="dropzone">
        <div class="dz-icon">&#128228;</div>
        <p class="dz-title">영상 파일을 드래그하거나 클릭해서 선택하세요</p>
        <p class="dz-hint">MP4 · AVI · MOV · MKV · WMV (최대 2GB)</p>
        <input type="file" id="fileInput" accept="video/*" hidden>
      </div>
      <div class="file-selected hidden" id="fileSelected">
        <span class="file-icon">&#127916;</span>
        <span id="fileName">파일명</span>
        <button class="btn-remove" id="removeFile">&#10005;</button>
      </div>
    </div>

    <!-- URL tab -->
    <div class="tab-pane hidden" id="pane-url">
      <div class="url-row">
        <input type="text" id="urlInput"
               placeholder="YouTube, 네이버TV, 카카오TV 등 영상 URL을 붙여넣으세요">
      </div>
      <p class="url-hint">yt-dlp가 지원하는 1000개 이상의 사이트 가능 · 최초 URL 사용 시 yt-dlp 자동 설치</p>
    </div>

    <!-- Options -->
    <div class="options-wrap">
      <h3 class="options-title">캡쳐 옵션 <span class="options-subtitle">원하는 장면 유형을 선택하세요</span></h3>
      <div class="options-grid">

        <label class="opt-card active" id="card-all">
          <input type="checkbox" id="optAll" checked>
          <div class="opt-icon all">&#127916;</div>
          <div class="opt-text">
            <strong>전체 주요 장면</strong>
            <span>장면 전환 시점 자동 감지</span>
          </div>
          <div class="opt-check">&#10003;</div>
        </label>

        <label class="opt-card" id="card-ai">
          <input type="checkbox" id="optAI">
          <div class="opt-icon ai">&#129302;</div>
          <div class="opt-text">
            <strong>AI 생성 문구</strong>
            <span>AI 제작·생성 표시 장면</span>
          </div>
          <div class="opt-check">&#10003;</div>
        </label>

        <label class="opt-card" id="card-invest">
          <input type="checkbox" id="optInvest">
          <div class="opt-icon invest">&#9888;</div>
          <div class="opt-text">
            <strong>투자유의문구</strong>
            <span>투자 관련 경고·고지 장면</span>
          </div>
          <div class="opt-check">&#10003;</div>
        </label>

        <label class="opt-card" id="card-title">
          <input type="checkbox" id="optTitle">
          <div class="opt-icon title">&#127991;</div>
          <div class="opt-text">
            <strong>타이틀 장면</strong>
            <span>영상 시작 및 제목 카드</span>
          </div>
          <div class="opt-check">&#10003;</div>
        </label>

      </div>
    </div>

    <button class="btn-primary" id="startBtn" disabled>캡쳐 시작</button>

  </section>

  <!-- ── Progress Card ─────────────────────────────────────────────── -->
  <section class="card hidden" id="progressCard">
    <div class="progress-header">
      <span class="progress-spinner"></span>
      <h3 id="progressTitle">처리 중...</h3>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <p class="progress-msg" id="progressMsg">시작 중...</p>
  </section>

  <!-- ── Results Card ──────────────────────────────────────────────── -->
  <section class="card hidden" id="resultsCard">

    <div class="results-header">
      <div>
        <h2>캡쳐 결과</h2>
        <p class="results-sub" id="resultsSub">0개 장면</p>
      </div>
      <div class="results-actions">
        <button class="btn-secondary" id="newCaptureBtn">&#8635; 새 캡쳐</button>
        <button class="btn-download" id="downloadAllBtn">&#8595; 전체 다운로드 (ZIP)</button>
      </div>
    </div>

    <div class="filter-bar">
      <button class="pill active" data-filter="all">전체</button>
      <button class="pill" data-filter="ai">&#129302; AI 생성</button>
      <button class="pill" data-filter="investment">&#9888; 투자유의</button>
      <button class="pill" data-filter="title">&#127991; 타이틀</button>
      <button class="pill" data-filter="scene">&#127916; 일반 장면</button>
    </div>

    <div class="empty-state hidden" id="emptyState">
      <div class="empty-icon">&#128270;</div>
      <p>해당 조건에 맞는 장면이 없습니다</p>
    </div>

    <div class="frames-grid" id="framesGrid"></div>

  </section>

</main>

<!-- ── Modal ────────────────────────────────────────────────────────── -->
<div class="modal-overlay hidden" id="modalOverlay"></div>
<div class="modal hidden" id="modal">
  <button class="modal-close" id="modalClose">&#10005;</button>
  <div class="modal-img-wrap">
    <img id="modalImg" src="" alt="캡쳐 프레임">
  </div>
  <div class="modal-info">
    <div id="modalBadges"></div>
    <p class="modal-ts" id="modalTs"></p>
    <p class="modal-ocr" id="modalOcr"></p>
    <a id="modalDl" href="#" class="btn-primary modal-dl-btn">&#8595; 이 장면 다운로드</a>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
